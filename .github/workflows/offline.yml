name: Offline contract checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -B run_pipeline.py check
      - run: python -B examples/test_trajectory_excerpt.py
  training-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned CPU training-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install transformers==4.52.4 tokenizers==0.21.1 safetensors==0.8.0 lm-format-enforcer==0.11.3
      - name: Test Qwen3 replay, policy loss, and grammar support
        working-directory: training
        run: |
          python -B test_layer_replay.py
          python -B -m unittest test_torch test_grammar_support test_training_dependencies
      - name: Test SFT alignment contracts
        working-directory: sft
        run: python -B -m unittest test_exported_training_contracts test_pdf_visibility
